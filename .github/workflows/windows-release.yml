name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: [self-hosted, Windows, X64, cli-box]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Require D drive runner workspace
        run: |
          if ($env:GITHUB_WORKSPACE -notlike 'D:\*') {
            throw "Runner workspace must be on D:; got $env:GITHUB_WORKSPACE"
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add NSIS to PATH
        run: |
          $nsisDir = 'D:\tools\nsis-3.12'
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            throw "NSIS is missing from $nsisDir"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify packaging tools
        run: |
          go version
          node --version
          npm --version
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw 'NSIS makensis is not available on PATH'
          }
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          $wails = Join-Path (go env GOPATH) 'bin\wails.exe'
          & $wails version

      - name: Test
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          go test ./...

      - name: Build NSIS installer
        run: |
          $wails = Join-Path (go env GOPATH) 'bin\wails.exe'
          & $wails build -clean -platform windows/amd64 -nsis

      - name: Collect artifacts and checksums
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item build\bin\*.exe artifacts\

          $sdkBin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64' -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdkBin) { throw 'Windows SDK packaging tools are missing' }
          $makeAppx = Join-Path $sdkBin.FullName 'makeappx.exe'
          $signTool = Join-Path $sdkBin.FullName 'signtool.exe'
          if (-not (Test-Path $makeAppx) -or -not (Test-Path $signTool)) {
            throw 'makeappx.exe or signtool.exe is missing'
          }

          $layout = Join-Path $PWD 'msix-layout'
          New-Item -ItemType Directory -Force (Join-Path $layout 'Assets') | Out-Null
          Copy-Item build\bin\cli-box.exe $layout\
          Copy-Item packaging\msix\AppxManifest.xml $layout\
          Copy-Item packaging\msix\Assets\*.png (Join-Path $layout 'Assets')

          $msix = Join-Path $PWD 'artifacts\CLIBox_1.0.2.0_x64.msix'
          & $makeAppx pack /d $layout /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }

          $publisher = 'CN=88C646E7-F180-4071-8BEA-93AEBF0E0696'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName 'CLI Box Store package test signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -HashAlgorithm SHA256
          try {
            & $signTool sign /fd SHA256 /sha1 $cert.Thumbprint /s My $msix
            if ($LASTEXITCODE -ne 0) { throw "SignTool failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          }

          Get-ChildItem artifacts\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content artifacts\SHA256SUMS.txt -Encoding ascii
          }
          Get-ChildItem artifacts\*.msix | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content artifacts\SHA256SUMS.txt -Encoding ascii
          }
          if (-not (Test-Path artifacts\*-installer.exe)) {
            throw 'NSIS installer was not produced'
          }
          if (-not (Test-Path artifacts\*.msix)) {
            throw 'Microsoft Store MSIX package was not produced'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: cli-box-windows-amd64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts\* --generate-notes --verify-tag
